[package]
name = "timestral-rs"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "timestral-rs"
description = "Timestral inference and forecasting with Candle"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
# Force the reference Metal implementation for controlled benchmarks.
unfused-rmsnorm = []
# Disable the one-row variable-attention fast path for A/B comparisons.
full-variate-attention = []

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
